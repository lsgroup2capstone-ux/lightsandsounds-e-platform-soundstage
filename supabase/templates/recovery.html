<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Reset your SoundStage password</title></head>
  <body style="font-family:Arial,sans-serif;color:#171717;padding:24px">
    <h2>Reset your SoundStage password</h2>
    <p>Enter this 6-digit one-time code on the password reset screen:</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:8px">{{ .Token }}</p>
    <p>This code can only be used once. If it expires, request a new code.</p>
    <p>If you did not request a password reset, ignore this email. Do not share this code.</p>
  </body>
</html>
